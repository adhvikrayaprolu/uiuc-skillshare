name: Release build

# Manual only. No hosting exists yet, so this builds and checks the production image
# and stops there: it pushes nothing and deploys nothing. Add a deploy step once a host
# and its secrets are approved (see docs/operations.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: skillshare-release:${{ github.sha }}
          build-args: VITE_RELEASE=${{ github.sha }}
          cache-from: type=gha
      - name: Production settings refuse unsafe defaults
        run: docker run --rm skillshare-release:${{ github.sha }} python production_check.py
