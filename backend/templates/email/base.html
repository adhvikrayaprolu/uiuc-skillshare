<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Illini SkillShare{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0F172A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8FAFC;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;">
        <tr><td style="background:#13294B;padding:18px 28px;">
          <span style="color:#ffffff;font-size:18px;font-weight:700;">Illini <span style="color:#FF5F05;">SkillShare</span></span>
        </td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:18px 28px;border-top:1px solid #E2E8F0;font-size:12px;line-height:1.5;color:#64748B;">
          {% block footer %}You're getting this because of your Illini SkillShare account. <a href="{{ settings_url }}" style="color:#13294B;">Change email settings</a>.{% endblock %}<br>
          Illini SkillShare is an independent student project, not affiliated with or endorsed by the University of Illinois.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
