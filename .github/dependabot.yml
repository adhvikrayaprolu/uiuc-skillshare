version: 2
# Patch and minor updates arrive grouped in one PR per ecosystem; majors get their own
# group so a framework upgrade never blocks routine security fixes.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-minor:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
