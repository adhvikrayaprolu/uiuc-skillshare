<!doctype html>
<!-- Source for public/og-image.png. Re-render with: npm run og-image (inside the browser-check image). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #13294B 0%, #1a3a6b 62%, #B83E00 100%); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 24px; margin-bottom: 40px; }
  .mark { width: 96px; height: 96px; border-radius: 24px; background: linear-gradient(135deg, #13294B, #FF5F05); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .name { font-size: 44px; font-weight: 800; letter-spacing: -0.5px; }
  .name span { color: #FFB27A; }
  h1 { font-size: 76px; line-height: 1.05; margin: 0 0 28px; font-weight: 800; letter-spacing: -1.5px; max-width: 960px; }
  p { font-size: 32px; margin: 0; color: #DBE5F3; }
  .pair { margin-top: 44px; display: flex; gap: 16px; font-size: 26px; font-weight: 600; }
  .chip { background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.3); border-radius: 999px; padding: 10px 24px; }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none"><path d="M8 12L12 8L16 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 16L12 12L16 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="8" r="2" fill="white"/><circle cx="8" cy="16" r="2" fill="white"/><circle cx="16" cy="16" r="2" fill="white"/></svg>
    </div>
    <div class="name">Illini <span>SkillShare</span></div>
  </div>
  <h1>Trade what you know for what you want to learn.</h1>
  <p>Swap skills with other Illinois students. Free, peer to peer.</p>
  <div class="pair"><span class="chip">Python for Figma</span><span class="chip">Guitar for Spanish</span><span class="chip">React for Public speaking</span></div>
</body>
</html>
