name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v3
      - name: Cache application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: skillshare-local-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: PostgreSQL, browser, accessibility and recovery checks
        run: make check
      - name: Browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove disposable CI services
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --disable-pip -r backend/requirements.txt
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
